[package]
name = "hydra"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "unstable-ext"] }
# Both features are unstable (SPEC §9): `unstable-dynamic` is the completion
# engine, `unstable-ext` on clap is the `Arg::add` that hangs a candidate set off
# an arg. Pinned by Cargo.lock; a shape change surfaces as a build error.
clap_complete = { version = "4.6.8", features = ["unstable-dynamic"] }
fs4 = "1.1.0"
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# No `preserve_order`: serde_json's Map is a BTreeMap by default, and that is
# what gives us the sorted keys of SPEC §3. `preserve_order` swaps in IndexMap
# and the stable-diff property goes with it.
serde_json = "1.0.151"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.19"
ulid = { version = "3.0.0", features = ["serde"] }
